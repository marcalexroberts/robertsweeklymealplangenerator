    /* Base layout */
    body {
        font-family: Arial, sans-serif;
        margin: 2rem auto;
        padding: 0 1rem;
        max-width: 900px;
        line-height: 1.5;
    }

    h1 { margin-bottom: 1.5rem; font-size: 1.8rem; }
    h2 { margin-top: 2rem; font-size: 1.4rem; }

    /* Day rows */
    .day-row {
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
    }

    label {
        font-weight: bold;
        width: 7rem;
        font-size: 1rem;
    }

    select {
        padding: 0.6rem;
        width: 100%;
        max-width: 22rem;
        font-size: 1rem;
    }

    button {
        padding: 0.7rem 1.2rem;
        font-size: 1rem;
        border-radius: 0.4rem;
        border: 1px solid #ccc;
        background: #f7f7f7;
    }

    .locked-label {
        font-size: 0.9rem;
        color: #555;
    }

    #controls {
        margin-top: 1.5rem;
        margin-bottom: 2rem;
        display: flex;
        gap: 0.7rem;
        flex-wrap: wrap;
    }

    #filters {
        margin-bottom: 1.5rem;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
    }

    #shopping-list, #meal-plan-display {
        margin-top: 1.5rem;
    }

    ul { margin-top: 0.5rem; padding-left: 1.2rem; }

    [title] { cursor: help; }

    /* Mobile layout adjustments */
    @media (max-width: 600px) {
        .day-row {
            flex-direction: column;
            align-items: flex-start;
        }

        label {
            width: auto;
        }

        select, button {
            width: 100%;
        }

        #controls button {
            width: 100%;
        }
    }

    /* Print mode */
    @media print {
        #controls, #filters, .lock-checkbox, .locked-label, .tooltip-note, button {
            display: none !important;
        }
        body {
            margin: 1rem;
            max-width: none;
        }
        select {
            border: none;
            background: none;
            padding: 0;
            width: auto;
        }
    }
</style>

const dayTags = {
    Monday: "airfryer",
    Tuesday: "mexican",
    Wednesday: "leftovers",
    Thursday: "pasta",
    Friday: "elevated",
    Saturday: "free",
    Sunday: "free"

const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const lockedDays = new Set();

/* UNIVERSAL COPY FUNCTION */
function copyTextUniversal(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => alert("Copied!"))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  textArea.style.position = "fixed";
  textArea.style.top = "0";
  textArea.style.left = "0";
  textArea.style.opacity = "0";
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  textArea.setSelectionRange(0, 99999);
  try {
    document.execCommand("copy");
    alert("Copied!");
  } catch (err) {
    alert("Unable to copy");
  }
  document.body.removeChild(textArea);
}

/* BUILD UI */
function buildUI() {
    const container = document.getElementById("meal-plan");
    container.innerHTML = "";

    days.forEach(day => {
        const row = document.createElement("div");
        row.className = "day-row";

        const label = document.createElement("label");
        label.textContent = day + ":";

        const select = document.createElement("select");
        select.id = `${day}-select`;

        populateSelectForDay(day, select);

        const lockCheckbox = document.createElement("input");
        lockCheckbox.type = "checkbox";
        lockCheckbox.className = "lock-checkbox";
        lockCheckbox.id = `${day}-lock`;
        lockCheckbox.onchange = () => toggleLockDay(day, lockCheckbox.checked);

        const lockLabel = document.createElement("span");
        lockLabel.className = "locked-label";
        lockLabel.textContent = "Lock";

        const btn = document.createElement("button");
        btn.textContent = "Randomize " + day;
        btn.onclick = () => randomizeDay(day);

        row.appendChild(label);
        row.appendChild(select);
        row.appendChild(btn);
        row.appendChild(lockCheckbox);
        row.appendChild(lockLabel);

        container.appendChild(row);
    });
}

/* FILTERS */
function passesProteinFilter(meal, filterValue) {
    if (filterValue === "all") return true;
    if (filterValue === "Vegetarian") return meal.protein === "None";
    return meal.protein === filterValue;
}

function populateSelectForDay(day, selectElement) {
    const proteinFilter = document.getElementById("protein-filter").value;
    selectElement.innerHTML = "";

    const tag = dayTags[day];

    const mealsForDay = mealBank.filter(m => {
        const isDayMatch = m.tags.includes(tag);
        const isIntentional = m.tags.includes("intentional");

        // Intentional meals always appear
        if (isIntentional) return true;

        // Day-themed meals must match tag and protein filter
        if (!isDayMatch) return false;
        return passesProteinFilter(m, proteinFilter);
    });

    mealsForDay.forEach(meal => {
        const option = document.createElement("option");
        option.value = meal.id;
        option.textContent = meal.name;
        option.title = meal.description;
        selectElement.appendChild(option);
    });
}

function applyFilters() {
    days.forEach(day => {
        const select = document.getElementById(`${day}-select`);
        populateSelectForDay(day, select);
    });
}

/* LOCKING */
function toggleLockDay(day, isLocked) {
    if (isLocked) lockedDays.add(day);
    else lockedDays.delete(day);
}

/* RANDOMIZER */
function getRandomMealForDay(day) {
    const proteinFilter = document.getElementById("protein-filter").value;
    const tag = dayTags[day];

    const meals = mealBank.filter(m =>
        m.tags.includes(tag) &&
        !m.tags.includes("intentional") &&
        passesProteinFilter(m, proteinFilter)
    );

    if (meals.length === 0) return null;
    return meals[Math.floor(Math.random() * meals.length)];
}

function randomizeDay(day) {
    if (lockedDays.has(day)) return;
    const meal = getRandomMealForDay(day);
    if (!meal) return;
    const select = document.getElementById(`${day}-select`);
    populateSelectForDay(day, select);
    select.value = meal.id;
}

function randomizeWeek() {
    days.forEach(day => randomizeDay(day));
}

}

  "olive oil", "salt", "pepper", "butter", "soy sauce",
  "honey", "garlic powder", "onion powder", "paprika",
  "red pepper flakes", "flour", "sugar"
];

const costcoItems = [
  "nuggets", "frozen shrimp", "rice", "pasta",
  "rotisserie chicken", "frozen fries"
];

const categories = {
  Produce: [
    "garlic", "onion", "lemons", "lemon", "lime", "cilantro",
    "zucchini", "bell peppers", "mixed vegetables",
    "apple", "yukon potatoes", "basil", "thyme",
    "broccoli", "cherry tomatoes", "potatoes", "rosemary",
    "slaw mix", "russet potatoes", "vegetable side",
    "parsley", "red onion", "green onion", "ginger",
    "dill", "celery", "cabbage", "oregano",
    "romaine", "cucumber", "lettuce",
    "avocado", "peppers", "red peppers"
  ],

  Meat: [
    "chicken", "chicken thighs", "chicken breast",
    "turkey", "shrimp", "salmon", "beef",
    "whole chicken", "sausages"
  ],

  Dairy: [
    "parmesan", "mozzarella", "feta", "cheddar", "butter",
    "cream", "tzatziki", "parmesan rind"
  ],

  Bakery: [
    "pita", "hoagie rolls", "buns", "naan", "tortillas",
    "corn tortillas", "pie crust", "pizza dough",
    "pita chips", "sausage rolls", "pie dough"
  ],

  Pantry: [
    "crushed tomatoes", "tomatoes", "rice vinegar", "soy sauce",
    "pasta", "marinara", "stock", "ketchup", "dried chiles",
    "consomme", "angel hair", "olives", "roasted peppers",
    "white wine", "capellini", "pesto", "penne", "vodka",
    "stir fry sauce", "bay leaves", "chipotle peppers",
    "adobo sauce", "sesame oil", "harissa", "tomato paste",
    "broth", "capers", "red wine vinegar", "tahini",
    "sesame seeds", "pickles"
  ],

  Frozen: [
    "frozen fries", "frozen shrimp"
  ],

  Other: []
};

/* SHOPPING LIST */
function generateShoppingList() {
  const weeklyItems = new Map();
  const costcoList = new Map();

  days.forEach(day => {
    const select = document.getElementById(`${day}-select`);
    const mealId = parseInt(select.value, 10);
    const meal = mealBank.find(m => m.id === mealId);
    if (!meal) return;

    // Skip intentional + leftovers
    if (meal.tags.includes("intentional") || meal.tags.includes("leftovers")) return;

    meal.ingredients.forEach(rawIng => {
      let ing = normalizeIngredient(rawIng);

      // Skip pantry staples
      if (pantryStaples.includes(ing.toLowerCase())) return;

      // Costco items go to Costco section
      if (costcoItems.includes(ing.toLowerCase())) {
        costcoList.set(ing, (costcoList.get(ing) || 0) + 1);
      } else {
        weeklyItems.set(ing, (weeklyItems.get(ing) || 0) + 1);
      }
    });
  });

  // Group weekly items by category
  const grouped = {};
  Object.keys(categories).forEach(cat => grouped[cat] = []);

  weeklyItems.forEach((count, ing) => {
    let placed = false;
    for (const [cat, items] of Object.entries(categories)) {
      if (items.includes(ing.toLowerCase())) {
        grouped[cat].push(`${ing}${count > 1 ? ` (x${count})` : ""}`);
        placed = true;
        break;
      }
    }
    if (!placed) grouped.Other.push(`${ing}${count > 1 ? ` (x${count})` : ""}`);
  });

  // Build HTML output
  let html = `<p><strong>Weekly Shopping List</strong></p>`;
  html += `<button onclick="copyShoppingList()">Copy Shopping List</button>`;

  Object.entries(grouped).forEach(([cat, items]) => {
    if (items.length === 0) return;
    html += `<h4>${cat}</h4><ul>`;
    items.forEach(i => html += `<li>${i}</li>`);
    html += `</ul>`;
  });

  // Costco section
  if (costcoList.size > 0) {
    html += `<h3>Costco (Bulk / Monthly)</h3><ul>`;
    costcoList.forEach((count, ing) => {
      html += `<li>${ing}${count > 1 ? ` (x${count})` : ""}</li>`;
    });
    html += `</ul>`;
  }

  html += `<p><em>Note: Wednesday leftovers and intentional meals do not add ingredients.</em></p>`;

  document.getElementById("shopping-list").innerHTML = html;
}

/* MEAL PLAN DISPLAY */
function showMealPlan() {
    let html = "<p>Here is your weekly meal plan:</p>";
    html += `<button onclick="copyMealPlan()">Copy Meal Plan</button>`;
    html += "<ul>";

    days.forEach(day => {
        const select = document.getElementById(`${day}-select`);
        const mealId = parseInt(select.value, 10);
        const meal = mealBank.find(m => m.id === mealId);
        const name = meal ? meal.name : "(No meal selected)";
        html += `<li><strong>${day}:</strong> ${name}</li>`;
    });

    html += "</ul>";
    document.getElementById("meal-plan-display").innerHTML = html;
}

/* COPY: MEAL PLAN */
function copyMealPlan() {
    let text = "Weekly Meal Plan\n\n";

    days.forEach(day => {
        const select = document.getElementById(`${day}-select`);
        const mealId = parseInt(select.value, 10);
        const meal = mealBank.find(m => m.id === mealId);
        const name = meal ? meal.name : "(No meal selected)";
        text += `${day}: ${name}\n`;
    });

    copyTextUniversal(text);
}

/* COPY: SHOPPING LIST */
function copyShoppingList() {
    const listDiv = document.getElementById("shopping-list");
    const items = listDiv.querySelectorAll("ul li");

    let text = "Shopping List\n\n";
    if (items.length === 0) {
        text += "(No ingredients — intentional choices or empty plan)\n";
    } else {
        items.forEach(li => {
            text += `• ${li.textContent}\n`;
        });
    }

    copyTextUniversal(text);
}

/* COPY: EMAIL/TEXT BODY */
function copyEmailBody() {
    let body = "Weekly Meal Plan\n\n";

    days.forEach(day => {
        const select = document.getElementById(`${day}-select`);
        const mealId = parseInt(select.value, 10);
        const meal = mealBank.find(m => m.id === mealId);
        const name = meal ? meal.name : "(No meal selected)";
        body += `${day}: ${name}\n`;
    });

    body += "\nShopping List:\n";

    const ingredientsMap = new Map();
    days.forEach(day => {
        const select = document.getElementById(`${day}-select`);
        const mealId = parseInt(select.value, 10);
        const meal = mealBank.find(m => m.id === mealId);
        if (!meal) return;

        if (meal.tags.includes("intentional") || meal.tags.includes("leftovers")) return;

        meal.ingredients.forEach(ing => {
            const key = ing.trim();
            ingredientsMap.set(key, (ingredientsMap.get(key) || 0) + 1);
        });
    });

    if (ingredientsMap.size === 0) {
        body += "(No ingredients — intentional choices or empty plan)\n";
    } else {
        ingredientsMap.forEach((count, ingredient) => {
            body += `• ${ingredient}${count > 1 ? ` (x${count})` : ""}\n`;
        });
    }

    copyTextUniversal(body);
}
